["Do you have an FSSAI licence?","We have applied for our FSSAI licence and the application is in process (Application No. {{fssai}}). We will show the licence number here and in the footer as soon as it is issued."],
["What products do you sell?","Dairy (fresh milk, desi ghee, paneer), spices (red chilli, turmeric, whole cumin), pulses (arhar, masoor and chana dal) and vermicompost in 5 kg and 25 kg packs."],
["How do you maintain quality?","We source from local farms and trusted suppliers, check every lot for freshness, cleanliness and aroma, set aside anything that does not meet our standard, and pack in clean, sealed packs."],
["How do I place an order?","Pick a product, choose its pack size, add it to the cart, enter your name, phone and address, then pay. You can also send your order on WhatsApp."],
["Can I choose a different pack size?","Many products come in more than one pack size. Tap the size on the product card (for example 500 g, 1 kg or 5 kg) and the price updates for that size."],
["How can I pay?","Pay by UPI QR code or payment link, or by bank transfer using the details shown at checkout. You can also arrange payment on WhatsApp. We do not store your card or bank credentials."],
["Do you deliver to my area, and how long does it take?","We deliver in our service areas. Enter your address at checkout and we will confirm availability, delivery time and charges before dispatch."],
["What is the delivery charge?","The delivery charge, if any, is shown in your cart before you pay. Bulk orders can be quoted separately."],
["How do I track my order?","After you place an order you get an Order ID. Enter it in the Track Order section, or message us on WhatsApp with your Order ID for an update."],
["What if my order is damaged or wrong?","Tell us within 48 hours of delivery with your Order ID and a clear photo or short video. After approval we replace the item or refund you to the original payment source within 5 to 7 working days."],
["Can I cancel my order?","Yes, before it is dispatched, for a full refund. Once dispatched it cannot be cancelled, but the damaged and wrong-item rules still apply."],
["Do you take bulk orders?","Yes. Shops, hotels, caterers and farms can order 25 kg or more of dairy, spices, pulses or vermicompost. Use the Bulk Orders form and we will quote on WhatsApp."],
["How should I store the products?","Store as advised on the pack. Dairy needs refrigeration and should be used within the period stated on the pack. Keep spices and pulses sealed in a cool, dry place."],
["What is vermicompost and how is it used?","Vermicompost is organic compost made from farm waste with the help of earthworms. It is used in kitchen gardens and farms to improve the soil. It is not for consumption; keep it away from food and children."],
["How can I contact you?","Call {{phone}}, email {{email}} or message us on WhatsApp. Please include your Order ID if your question is about an order."]],

["क्या आपके पास FSSAI लाइसेंस है?","हमने FSSAI लाइसेंस के लिए आवेदन किया है और वह प्रक्रिया में है (आवेदन संख्या {{fssai}})। लाइसेंस मिलते ही उसका नंबर यहाँ और फूटर में दिखाएँगे।"],
["आप कौन से उत्पाद बेचते हैं?","डेयरी (ताज़ा दूध, देसी घी, पनीर), मसाले (लाल मिर्च, हल्दी, साबुत जीरा), दालें (अरहर, मसूर और चना दाल) और 5 किलो व 25 किलो पैक में वर्मीकम्पोस्ट।"],
["आप गुणवत्ता कैसे बनाए रखते हैं?","हम स्थानीय खेतों और भरोसेमंद सप्लायर से माल लेते हैं, हर खेप की ताज़गी, सफ़ाई और खुशबू जाँचते हैं, मानक पर खरा न उतरने वाला माल अलग कर देते हैं और साफ़, सील बंद पैक में भेजते हैं।"],
["ऑर्डर कैसे करूँ?","उत्पाद चुनें, उसका पैक साइज़ चुनें, कार्ट में जोड़ें, नाम, फोन और पता भरें, फिर भुगतान करें। आप अपना ऑर्डर WhatsApp पर भी भेज सकते हैं।"],
["क्या मैं अलग पैक साइज़ चुन सकता हूँ?","कई उत्पाद एक से ज़्यादा पैक साइज़ में आते हैं। उत्पाद कार्ड पर साइज़ (जैसे 500 ग्राम, 1 किलो या 5 किलो) दबाएँ, उसी साइज़ का भाव दिखेगा।"],
["भुगतान कैसे करूँ?","UPI QR कोड या पेमेंट लिंक से, या चेकआउट पर दिखे बैंक विवरण से बैंक ट्रांसफर करें। WhatsApp पर भी भुगतान तय कर सकते हैं। हम आपके कार्ड या बैंक की जानकारी सेव नहीं करते।"],
["क्या मेरे क्षेत्र में डिलीवरी है और कितना समय लगेगा?","हम अपने सेवा क्षेत्र में डिलीवरी करते हैं। चेकआउट पर पता डालें, भेजने से पहले हम उपलब्धता, समय और शुल्क की पुष्टि करेंगे।"],
["डिलीवरी शुल्क कितना है?","डिलीवरी शुल्क, अगर है तो, भुगतान से पहले आपके कार्ट में दिखता है। थोक ऑर्डर का भाव अलग से बताया जा सकता है।"],
["अपना ऑर्डर कैसे ट्रैक करूँ?","ऑर्डर करने पर आपको ऑर्डर आईडी मिलती है। उसे ऑर्डर ट्रैक करें सेक्शन में डालें, या जानकारी के लिए ऑर्डर आईडी के साथ WhatsApp पर संदेश भेजें।"],
["सामान खराब या गलत आए तो?","डिलीवरी के 48 घंटे के भीतर ऑर्डर आईडी और साफ़ फोटो या छोटे वीडियो के साथ बताएँ। मंज़ूरी के बाद हम सामान बदलेंगे या 5 से 7 कार्य दिवस में मूल भुगतान माध्यम में रिफंड करेंगे।"],
["क्या मैं ऑर्डर रद्द कर सकता हूँ?","हाँ, भेजे जाने से पहले, पूरे रिफंड के साथ। भेजे जाने के बाद रद्द नहीं होता, पर खराब या गलत सामान के नियम लागू रहते हैं।"],
["क्या आप थोक ऑर्डर लेते हैं?","हाँ। दुकान, होटल, कैटरर और खेत डेयरी, मसाले, दालें या वर्मीकम्पोस्ट 25 किलो या ज़्यादा मँगा सकते हैं। थोक ऑर्डर फ़ॉर्म भरें, हम WhatsApp पर भाव बताएँगे।"],
["उत्पाद कैसे रखें?","पैक पर लिखे अनुसार रखें। डेयरी को फ्रिज में रखें और पैक पर लिखी अवधि में इस्तेमाल करें। मसाले और दालें ठंडी, सूखी जगह पर बंद रखें।"],
["वर्मीकम्पोस्ट क्या है और कैसे इस्तेमाल होता है?","वर्मीकम्पोस्ट केंचुओं की मदद से खेत के कचरे से बनी जैविक खाद है। इसे किचन गार्डन और खेतों में मिट्टी सुधारने के लिए इस्तेमाल करते हैं। यह खाने के लिए नहीं है; खाने और बच्चों से दूर रखें।"],
["आपसे संपर्क कैसे करूँ?","{{phone}} पर कॉल करें, {{email}} पर ईमेल करें या WhatsApp पर संदेश भेजें। ऑर्डर के बारे में पूछते समय ऑर्डर आईडी ज़रूर लिखें।"]],

["Kya aapke paas FSSAI licence hai?","Humne FSSAI licence ke liye apply kiya hai aur wo process mein hai (Application No. {{fssai}}). Licence milte hi uska number yahan aur footer mein dikhayenge."],
["Aap kaun se products bechte hain?","Dairy (taaza doodh, desi ghee, paneer), masale (lal mirch, haldi, sabut jeera), dalein (arhar, masoor aur chana dal) aur 5 kg aur 25 kg pack mein vermicompost."],
["Aap quality kaise banaye rakhte hain?","Hum local farms aur bharosemand suppliers se maal lete hain, har lot ki freshness, safai aur khushboo check karte hain, standard par khara na utarne wala maal alag kar dete hain aur saaf, sealed pack mein bhejte hain."],
["Order kaise karein?","Product chunein, uska pack size chunein, cart mein daalein, naam, phone aur address bharein, phir payment karein. Aap order WhatsApp par bhi bhej sakte hain."],
["Kya main alag pack size chun sakta hoon?","Kai products ek se zyada pack size mein aate hain. Product card par size (jaise 500 g, 1 kg ya 5 kg) dabayein, usi size ka rate dikhega."],
["Payment kaise karein?","UPI QR code ya payment link se, ya checkout par dikhe bank details se bank transfer karein. WhatsApp par bhi payment tay kar sakte hain. Hum aapke card ya bank ki jaankari save nahi karte."],
["Kya mere area mein delivery hai aur kitna time lagega?","Hum apne service area mein delivery karte hain. Checkout par address daalein, dispatch se pehle hum availability, time aur charges confirm karenge."],
["Delivery charge kitna hai?","Delivery charge, agar hai to, payment se pehle aapke cart mein dikhta hai. Bulk orders ka rate alag se bataya ja sakta hai."],
["Apna order track kaise karein?","Order karne par aapko Order ID milti hai. Use Track Order section mein daalein, ya update ke liye Order ID ke saath WhatsApp par message karein."],
["Saaman kharab ya galat aaye to?","Delivery ke 48 ghante ke andar Order ID aur saaf photo ya chhote video ke saath bataiye. Approve hone ke baad hum saaman badlenge ya 5 se 7 working days mein original payment source mein refund karenge."],
["Kya main order cancel kar sakta hoon?","Haan, dispatch se pehle, poore refund ke saath. Dispatch ke baad cancel nahi hota, par kharab ya galat saaman ke niyam lagu rehte hain."],

["Products ko kaise rakhein?","Pack par likhe hisaab se rakhein. Dairy ko fridge mein rakhein aur pack par likhe time ke andar use karein. Masale aur dalein thandi, sookhi jagah par band rakhein."],

var DOC={"about": {"en": [["Who we are", "Yugal Agro Food Products is a farm-rooted food and agriculture business. We bring everyday kitchen staples and natural farm inputs from the field to your doorstep, with honest quality and fair prices."], ["What we offer", "Dairy: fresh milk, pure desi ghee and fresh paneer.|Spices: red chilli, turmeric, cumin and more, ground and packed for aroma.|Pulses: arhar, masoor and chana dal, cleaned and graded.|Vermicompost: organic compost in 5 kg packs and 25 kg bulk bags for kitchen gardens and farms."], ["Our promise", "We keep our products as close to nature as possible. We do not believe in shortcuts: what is on the label is what reaches your home."], ["Sourcing and quality", "We work with local farms and trusted suppliers, check every lot for freshness, cleanliness and aroma, and set aside whatever does not meet our standard."], ["Packing and hygiene", "Products are packed in clean, sealed packs showing the product name, weight and handling advice. Dairy is handled with care so it stays fresh until delivery."], ["Delivery", "We deliver in our service areas. Enter your address at checkout and we will confirm availability, delivery time and charges before dispatch."], ["Easy and safe payment", "Pay by UPI QR code or payment link, or place your order on WhatsApp. Your order ID lets you track every step."], ["Licence status", "Our FSSAI licence is in process. Application No.: {{fssai}}."], ["Bulk orders and farmers", "Shops, hotels, caterers and farms can order 25 kg or more directly from us. Use the Bulk Orders form to get a quote."], ["Customer care", "Have a question, feedback or a problem with an order? Message us on WhatsApp or use the contact details in the footer. We reply as quickly as we can."]], "hi": [["हम कौन हैं", "युगल एग्रो फूड प्रोडक्ट्स खेतों से जुड़ा खाद्य और कृषि व्यवसाय है। हम रसोई की रोज़मर्रा की चीज़ें और प्राकृतिक कृषि उत्पाद खेत से सीधे आपके द्वार तक पहुँचाते हैं, ईमानदार गुणवत्ता और वाजिब दाम पर।"], ["हम क्या देते हैं", "डेयरी: ताज़ा दूध, शुद्ध देसी घी और ताज़ा पनीर।|मसाले: लाल मिर्च, हल्दी, जीरा और अन्य, खुशबू के लिए पिसे और पैक।|दालें: अरहर, मसूर और चना दाल, साफ़ और छँटी हुई।|वर्मीकम्पोस्ट: किचन गार्डन और खेतों के लिए 5 किलो पैक और 25 किलो थोक बोरी में जैविक खाद।"], ["हमारा वादा", "हम अपने उत्पादों को प्रकृति के जितना करीब हो सके रखते हैं। हम शॉर्टकट में विश्वास नहीं करते: लेबल पर जो लिखा है, वही आपके घर पहुँचता है।"], ["खरीद और गुणवत्ता", "हम स्थानीय खेतों और भरोसेमंद सप्लायर के साथ काम करते हैं, हर खेप की ताज़गी, सफ़ाई और खुशबू जाँचते हैं, और जो हमारे मानक पर खरा नहीं उतरता उसे अलग कर देते हैं।"], ["पैकिंग और स्वच्छता", "उत्पाद साफ़, सील बंद पैक में आते हैं जिन पर नाम, वज़न और रखरखाव की जानकारी होती है। डेयरी को सावधानी से संभाला जाता है ताकि डिलीवरी तक ताज़ा रहे।"], ["डिलीवरी", "हम अपने सेवा क्षेत्र में डिलीवरी करते हैं। चेकआउट पर पता डालें, भेजने से पहले हम उपलब्धता, समय और शुल्क की पुष्टि करेंगे।"], ["आसान और सुरक्षित भुगतान", "UPI QR कोड या पेमेंट लिंक से भुगतान करें, या WhatsApp पर ऑर्डर दें। ऑर्डर आईडी से आप हर चरण ट्रैक कर सकते हैं।"], ["लाइसेंस की स्थिति", "हमारा FSSAI लाइसेंस प्रक्रिया में है। आवेदन संख्या: {{fssai}}।"], ["थोक ऑर्डर और किसान", "दुकानें, होटल, कैटरर और खेत 25 किलो या अधिक सीधे हमसे मँगा सकते हैं। भाव के लिए थोक ऑर्डर फ़ॉर्म भरें।"], ["ग्राहक सहायता", "कोई सवाल, सुझाव या ऑर्डर में समस्या है? WhatsApp पर संदेश भेजें या फूटर में दिए संपर्क का उपयोग करें। हम जल्द से जल्द जवाब देते हैं।"]], "hg": [["Hum kaun hain", "Yugal Agro Food Products khet se jura food aur agriculture business hai. Hum rasoi ka roz ka saaman aur natural farm inputs khet se seedha aapke ghar tak pahunchate hain, imandaar quality aur sahi daam par."], ["Hum kya dete hain", "Dairy: taaza doodh, shuddh desi ghee aur taaza paneer.|Masale: lal mirch, haldi, jeera aur aur bhi, khushboo ke liye pise aur pack.|Dalein: arhar, masoor aur chana dal, saaf aur grade ki hui.|Vermicompost: kitchen garden aur kheton ke liye 5 kg pack aur 25 kg bulk bori mein organic khaad."], ["Hamara vaada", "Hum apne products ko jitna ho sake prakriti ke kareeb rakhte hain. Hum shortcut mein yakeen nahi karte: label par jo likha hai wahi aapke ghar pahunchta hai."], ["Sourcing aur quality", "Hum local farms aur bharosemand suppliers ke saath kaam karte hain, har lot ki freshness, safai aur khushboo check karte hain, aur jo hamare standard par khara na ho use alag kar dete hain."], ["Packing aur hygiene", "Products saaf, sealed pack mein aate hain jis par naam, weight aur rakh-rakhaav ki jaankari hoti hai. Dairy ko dhyan se handle kiya jata hai taaki delivery tak fresh rahe."], ["Delivery", "Hum apne service area mein delivery karte hain. Checkout par address daalein, dispatch se pehle hum availability, time aur charges confirm karenge."], ["Aasaan aur safe payment", "UPI QR code ya payment link se pay karein, ya WhatsApp par order dein. Order ID se aap har step track kar sakte hain."], ["Licence ki sthiti", "Hamara FSSAI licence process mein hai. Application No.: {{fssai}}."], ["Bulk orders aur kisan", "Dukaan, hotel, caterer aur khet 25 kg ya zyada seedha humse mangwa sakte hain. Rate ke liye Bulk Orders form bharein."], ["Customer care", "Koi sawaal, feedback ya order mein dikkat? WhatsApp par message karein ya footer ke contact use karein. Hum jald se jald jawab dete hain."]]}, "refund": {"en": [["Our commitment", "We want you to be happy with every order. If something is wrong, we will make it right with a replacement or a refund, as set out below."], ["When you can claim", "The product arrives damaged, leaked, spoiled or expired.|You received a wrong or missing item.|The quality is clearly not as described.|The weight or quantity is less than what you paid for."], ["Not eligible", "Change of mind after the pack is opened or used.|Damage caused by wrong storage or handling after delivery.|Dairy that was accepted in good condition and later spoiled due to storage.|Wrong address or phone number given by the customer, or nobody available after repeated delivery attempts.|Normal natural variation in colour, aroma or texture of spices, pulses and vermicompost."], ["How to claim", "1. Within 48 hours of delivery, message us on WhatsApp with your order ID.|2. Send clear photos or a short video of the product, the pack and the delivery label.|3. Our team reviews your claim and replies within 1 working day.|4. Please keep the product until the claim is settled; in some cases we may ask for it back."], ["Replacement or refund", "Once your claim is approved you can choose a free replacement or a refund. If the product is out of stock, we will refund you."], ["Refund timeline and mode", "Approved refunds go to the original UPI account or payment source within 5 to 7 working days. For orders paid by UPI on WhatsApp, the refund goes to the UPI ID that made the payment. Your bank may take a little longer to show it."], ["Cancellation", "You can cancel an order for a full refund before it is dispatched. After dispatch it cannot be cancelled, but the claim rules above still apply."], ["Delivery charges", "Delivery charges are refunded only when the problem is from our side (damaged, wrong or missing item), not for a change of mind."], ["Failed or double payments", "If money is deducted but no order is created, or you are charged twice, send us the payment screenshot. We will refund the extra amount within 5 to 7 working days."], ["Bulk orders", "Bulk orders and vermicompost orders of 25 kg or more are checked at delivery. Please report any issue the same day with photos."], ["Contact us", "For refunds and returns, message us on WhatsApp or use the details in the footer. Always include your order ID."]], "hi": [["हमारी प्रतिबद्धता", "हम चाहते हैं कि आप हर ऑर्डर से संतुष्ट रहें। कुछ गड़बड़ हो तो हम नीचे दिए नियमों के अनुसार बदलकर या रिफंड देकर उसे ठीक करेंगे।"], ["कब दावा कर सकते हैं", "उत्पाद टूटा-फूटा, लीक, खराब या एक्सपायर होकर आए।|गलत या कम सामान मिले।|गुणवत्ता विवरण से साफ़ तौर पर अलग हो।|वज़न या मात्रा भुगतान से कम हो।"], ["कब पात्र नहीं", "पैक खोलने या उपयोग के बाद मन बदलना।|डिलीवरी के बाद गलत स्टोरेज या हैंडलिंग से हुआ नुकसान।|अच्छी हालत में स्वीकार किया गया डेयरी, जो बाद में स्टोरेज के कारण खराब हुआ।|ग्राहक द्वारा गलत पता या फोन नंबर देना, या बार-बार प्रयास पर भी कोई उपलब्ध न होना।|मसालों, दालों और वर्मीकम्पोस्ट के रंग, खुशबू या बनावट में सामान्य प्राकृतिक अंतर।"], ["दावा कैसे करें", "1. डिलीवरी के 48 घंटे के भीतर ऑर्डर आईडी के साथ WhatsApp पर संदेश भेजें।|2. उत्पाद, पैक और डिलीवरी लेबल की साफ़ फोटो या छोटा वीडियो भेजें।|3. हमारी टीम दावे की जाँच करके 1 कार्य दिवस में जवाब देगी।|4. दावा निपटने तक उत्पाद संभालकर रखें; कुछ मामलों में हम उसे वापस मँगा सकते हैं।"], ["बदलाव या रिफंड", "दावा स्वीकृत होने पर आप मुफ़्त बदलाव या रिफंड चुन सकते हैं। उत्पाद स्टॉक में न हो तो रिफंड दिया जाएगा।"], ["रिफंड की समय-सीमा और माध्यम", "स्वीकृत रिफंड 5 से 7 कार्य दिवस में मूल UPI खाते या भुगतान माध्यम में भेजा जाता है। WhatsApp पर UPI से भुगतान वाले ऑर्डर में रिफंड उसी UPI आईडी में जाता है जिससे भुगतान हुआ। आपके बैंक में दिखने में थोड़ा अधिक समय लग सकता है।"], ["ऑर्डर रद्द करना", "भेजे जाने से पहले ऑर्डर रद्द करने पर पूरा रिफंड मिलेगा। भेजे जाने के बाद रद्द नहीं होता, पर ऊपर के दावा नियम लागू रहते हैं।"], ["डिलीवरी शुल्क", "डिलीवरी शुल्क तभी वापस होता है जब गलती हमारी हो (खराब, गलत या कम सामान), मन बदलने पर नहीं।"], ["असफल या दोहरा भुगतान", "पैसे कट गए पर ऑर्डर नहीं बना, या दो बार कटे, तो भुगतान का स्क्रीनशॉट भेजें। अतिरिक्त राशि 5 से 7 कार्य दिवस में लौटाई जाएगी।"], ["थोक ऑर्डर", "25 किलो या अधिक के थोक और वर्मीकम्पोस्ट ऑर्डर की जाँच डिलीवरी पर होती है। कोई समस्या हो तो उसी दिन फोटो के साथ बताएँ।"], ["संपर्क करें", "रिफंड और वापसी के लिए WhatsApp पर संदेश भेजें या फूटर के विवरण का उपयोग करें। हमेशा अपनी ऑर्डर आईडी लिखें।"]], "hg": [["Hamari commitment", "Hum chahte hain ki aap har order se khush rahein. Kuch galat ho to hum neeche diye niyam se replacement ya refund dekar use theek karenge."], ["Kab claim kar sakte hain", "Product toota-phoota, leak, kharab ya expire aaye.|Galat ya kam saaman mile.|Quality description se saaf alag ho.|Weight ya quantity payment se kam ho."], ["Kab eligible nahi", "Pack kholne ya use karne ke baad mann badalna.|Delivery ke baad galat storage ya handling se hua nuksaan.|Achhi halat mein accept kiya dairy jo baad mein storage se kharab hua.|Customer ka galat address ya phone number dena, ya baar-baar try par bhi koi na milna.|Masale, dal aur vermicompost ke rang, khushboo ya texture mein normal natural farak."], ["Claim kaise karein", "1. Delivery ke 48 ghante ke andar order ID ke saath WhatsApp par message karein.|2. Product, pack aur delivery label ki saaf photo ya chhota video bhejein.|3. Hamari team claim check karke 1 working day mein jawab degi.|4. Claim settle hone tak product sambhal kar rakhein; kuch cases mein hum use wapas mangwa sakte hain."], ["Replacement ya refund", "Claim approve hone par aap free replacement ya refund chun sakte hain. Product stock mein na ho to refund diya jayega."], ["Refund ka time aur tareeka", "Approved refund 5 se 7 working days mein original UPI account ya payment source mein jata hai. WhatsApp par UPI se hue payment ka refund usi UPI ID mein jata hai. Aapke bank mein dikhne mein thoda zyada time lag sakta hai."], ["Cancellation", "Dispatch se pehle order cancel karne par poora refund milega. Dispatch ke baad cancel nahi hota, par upar ke claim niyam lagu rehte hain."], ["Delivery charges", "Delivery charges tabhi wapas hote hain jab galti hamari ho (kharab, galat ya kam saaman), mann badalne par nahi."], ["Failed ya double payment", "Paise kat gaye par order nahi bana, ya do baar kate, to payment ka screenshot bhejein. Extra amount 5 se 7 working days mein wapas hoga."], ["Bulk orders", "25 kg ya zyada ke bulk aur vermicompost orders delivery par check hote hain. Koi dikkat ho to usi din photo ke saath bataiye."], ["Contact karein", "Refund aur return ke liye WhatsApp par message karein ya footer ke details use karein. Hamesha apni order ID likhein."]]}};

var LG={"refund": ["Refund & Return Policy", [["Scope", "This policy applies to every order placed with Yugal Agro Food Products (Yugal Agro, we, us) through this website, WhatsApp or phone. By placing an order you agree to this policy."], ["Eligibility for replacement or refund", "The product is damaged, leaked, spoiled or past its expiry date on delivery.|A wrong item was delivered, or an item is missing from your order.|The quality is clearly different from what was described at the time of sale.|The weight or quantity delivered is less than what was paid for."], ["Cases not eligible", "Change of mind after the pack has been opened or used.|Damage or spoilage caused by incorrect storage or handling after delivery.|An incorrect address or phone number supplied by the customer, or no one available to receive the order after repeated delivery attempts.|Normal natural variation in colour, aroma or texture of spices, pulses and vermicompost.|Dairy accepted in good condition that later spoiled because it was not stored as advised."], ["How to make a claim", "Contact us on WhatsApp or by email within 48 hours of delivery and quote your order ID.|Send clear photographs or a short video showing the product, the pack and the delivery label.|Keep the product and its packaging until the claim is settled. In some cases we may ask for it to be returned.|For dairy and other perishable items, please report the issue as soon as possible, ideally on the day of delivery."], ["Review and resolution", "Our team reviews each claim and replies within one working day of receiving complete details.|If the claim is approved, you may choose a free replacement or a refund. If the item is out of stock, a refund will be issued.|If a claim is declined, we will explain the reason in writing."], ["Refund method and timeline", "Approved refunds are made to the original payment source, normally the UPI account that made the payment, within 5 to 7 working days of approval.|We do not offer cash refunds.|Your bank may need additional time to show the credit."], ["Order cancellation", "An order can be cancelled for a full refund at any time before it is dispatched.|Once an order is dispatched it cannot be cancelled, but the claim terms above continue to apply."], ["Delivery charges", "Delivery charges are refunded only where the problem is on our side (damaged, wrong or missing item). They are not refunded for a change of mind."], ["Failed or duplicate payments", "If money has been deducted but no order was created, or you were charged twice, send us the payment screenshot and your registered phone number. The excess amount will be refunded within 5 to 7 working days."], ["Bulk orders", "Bulk orders and vermicompost orders of 25 kg or more are inspected at the time of delivery. Any issue must be reported on the same day with photographs."], ["Changes to this policy", "We may update this policy from time to time. The version published on this website at the time of your order applies to that order."], ["Contact", "For refunds, returns and cancellations, contact us on WhatsApp {{wa}}, phone {{phone}} or email {{email}}, and always include your order ID."]]], "terms": ["Terms & Conditions", [["Acceptance of terms", "By visiting this website or placing an order you agree to these Terms & Conditions, our Refund & Return Policy and our Privacy Policy. If you do not agree, please do not use the website."], ["About us", "Yugal Agro Food Products supplies dairy products, spices, pulses and vermicompost. Our FSSAI licence is in process (Application No. {{fssai}})."], ["Products and information", "We make every effort to describe products, weights and prices accurately. Product images are for illustration and the pack may differ slightly.|Natural products such as spices, pulses and compost may vary in colour, aroma and texture between batches."], ["Prices and availability", "All prices are in Indian Rupees and are as displayed at checkout. Prices and availability may change without notice.|If a price is shown wrongly because of an error, we may cancel the affected order and refund any payment made."], ["Orders and acceptance", "An order is confirmed only when we confirm it to you by order ID.|We may decline or cancel an order for reasons such as stock unavailability, delivery area limits, suspected misuse or a pricing error."], ["Payment", "Payment can be made by UPI QR code or payment link, or arranged through WhatsApp.|We do not store your bank or card credentials. UPI payments are processed by your own UPI app and bank."], ["Delivery", "We deliver within our service areas. Delivery times are estimates and may be affected by weather, traffic and other circumstances.|Risk in the goods passes to you on delivery. Please inspect the order when it arrives and report any issue as described in our Refund & Return Policy."], ["Storage and food safety", "Please store products as advised on the pack. Dairy products need refrigeration and should be consumed within the period stated on the pack.|Vermicompost is an agricultural input and is not for consumption. Keep it away from food and children."], ["Acceptable use", "You agree to provide accurate information, not to misuse the website, and not to attempt to interfere with its operation or security."], ["Intellectual property", "The name, logo, text and images on this website belong to Yugal Agro Food Products or their owners and may not be copied or reused without permission."], ["Limitation of liability", "To the extent permitted by law, our liability for any claim relating to an order is limited to the value of that order. We are not liable for indirect or consequential loss."], ["Governing law", "These terms are governed by the laws of India. Any dispute will be subject to the jurisdiction of the courts at the place of our business."], ["Changes and contact", "We may update these terms from time to time. For questions, contact {{phone}} or {{email}}."]]], "privacy": ["Privacy Policy", [[" (function(){
 var hv=$("hv");if(!hv)return;
 var V=[].slice.call(hv.querySelectorAll("video")),cur=-1,tk=0,paused=false,vis=true;
 V.forEach(function(v){v.muted=true;v.defaultMuted=true;v.volume=0;v.loop=false;v.controls=false;v.playsInline=true;
  ["muted","playsinline","webkit-playsinline","disablepictureinpicture","disableremoteplayback"].forEach(function(a){v.setAttribute(a,"")});v.setAttribute("x-webkit-airplay","deny")});
 function load(v){if(!v.getAttribute("src")){v.preload="auto";v.src=v.dataset.src;v.load()}}
 function tryPlay(v){try{v.muted=true;var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
 function show(i){
  var n=(i+V.length)%V.length,v=V[n],old=cur>=0?V[cur]:null,my=++tk,done=false;
  cur=n;load(v);
  try{v.currentTime=0}catch(e){}
  function reveal(){if(done||my!==tk)return;done=true;
   V.forEach(function(x){if(x!==v)x.classList.remove("on")});v.classList.add("on");
   if(old&&old!==v)setTimeout(function(){if(!old.classList.contains("on"))try{old.pause()}catch(e){}},1200)}
  if(!paused&&vis)tryPlay(v);
  if(v.readyState>=3&&!v.paused)reveal();
  else{v.addEventListener("playing",function f(){v.removeEventListener("playing",f);reveal()});setTimeout(reveal,1800)}
 }
 V.forEach(function(v,k){
  v.addEventListener("ended",function(){if(k===cur)show(cur+1)});
  v.addEventListener("playing",function(){if(k===cur)load(V[(cur+1)%V.length])});
  v.addEventListener("canplay",function(){if(k===cur&&!paused&&vis&&v.paused&&!v.ended)tryPlay(v)});
  v.addEventListener("error",function(){if(k===cur)setTimeout(function(){show(cur+1)},800)});
 });
 if("IntersectionObserver"in window)new IntersectionObserver(function(en){vis=en[0].isIntersecting;var v=V[cur];if(!v)return;if(vis&&!paused)tryPlay(v);else v.pause()},{threshold:.1}).observe(hv);
 document.addEventListener("visibilitychange",function(){var v=V[cur];if(!v)return;if(document.hidden)v.pause();else if(vis&&!paused)tryPlay(v)});
 /* if the browser blocked autoplay (iPhone low-power mode, data saver), start on first touch / scroll / click */
 ["touchstart","pointerdown","click","keydown","scroll"].forEach(function(ev){window.addEventListener(ev,function(){var v=V[cur];if(v&&!paused&&vis&&v.paused&&!v.ended)tryPlay(v)},{passive:true})});
 /* watchdog: keep the current video running */
 setInterval(function(){var v=V[cur];if(v&&!paused&&vis&&!document.hidden&&v.paused&&!v.ended)tryPlay(v)},1500);
 show(0);
})();
